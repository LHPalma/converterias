<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Converterias</title>
<meta name="description" content="Conversor de coisas: converte arquivos 100% local, direto no navegador (EPUB para PDF e PDF para EPUB).">
<meta name="theme-color" content="#2f6fed">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root { --bg:#fafafa; --fg:#1b1b1f; --muted:#666; --card:#fff; --accent:#2f6fed; --border:#ddd; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141416; --fg:#ececf0; --muted:#9a9aa5; --card:#1e1e22; --accent:#6c9bff; --border:#33333a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:480px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 20px; font-size:.9rem; }
  h2 { font-size:1.05rem; margin:0 0 10px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:16px; }
  label { display:block; font-size:.85rem; color:var(--muted); margin:12px 0 4px; }
  label.chk { display:flex; gap:8px; align-items:center; margin:12px 0 0; color:var(--fg); }
  label.chk input { width:auto; }
  select, input[type=number] { width:100%; padding:10px; font-size:1rem; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--fg); }
  .row { display:flex; gap:12px; } .row > div { flex:1; }
  button { width:100%; padding:14px; font-size:1rem; font-weight:600; border:0; border-radius:10px; background:var(--accent); color:#fff; }
  button:disabled { opacity:.5; }
  #drop { display:block; text-align:center; padding:28px 12px; border:2px dashed var(--border); border-radius:12px; color:var(--muted); cursor:pointer; margin:0; }
  #drop strong { display:block; color:var(--fg); margin-bottom:4px; word-break:break-word; }
  input[type=file] { display:none; }
  #status { min-height:1.4em; font-size:.9rem; color:var(--muted); margin-top:12px; }
  #status.err { color:#d33; }
  #list { list-style:none; margin:12px 0 0; padding:0; }
  #list li { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:8px; font-size:.85rem; word-break:break-word; }
  #list .n { display:block; font-weight:600; }
  #list .s { color:var(--muted); }
  #list .s.ok { color:#2a8a3e; } #list .s.err { color:#d33; }
  #list a { color:var(--accent); font-weight:600; margin-left:8px; }
  #outBtns { display:none; margin-top:12px; } #outBtns button { margin-bottom:8px; }
  button.alt { background:transparent; color:var(--accent); border:2px solid var(--accent); }
  small { color:var(--muted); display:block; margin-top:14px; font-size:.8rem; }
  .tabs { display:flex; gap:8px; margin-bottom:16px; }
  .tabs button { padding:10px; background:transparent; color:var(--accent); border:2px solid var(--accent); }
  .tabs button.on { background:var(--accent); color:#fff; }
</style>
</head>
<body>
<main>
  <h1>Converterias</h1>
  <p class="sub">Conversor de coisas, 100% local. Nada sai do seu aparelho.</p>

  <div class="tabs">
    <button type="button" data-mode="e2p" class="on">EPUB → PDF</button>
    <button type="button" data-mode="p2e">PDF → EPUB</button>
  </div>
  <div class="card">
    <label id="drop" for="file"><strong id="fname">Toque para escolher um ou mais .epub</strong><span id="fmeta"></span></label>
    <input id="file" type="file" multiple accept=".epub,application/epub+zip">
  </div>

  <div class="card" id="optE2P">
    <label for="size">Tamanho da página</label>
    <select id="size">
      <option value="letter">Carta (como o PDF de referência)</option>
      <option value="A4">A4</option>
      <option value="A5">A5 (bom para ler no celular)</option>
    </select>
    <label for="font">Fonte (pt)</label>
    <input id="font" type="number" min="6" max="30" value="15" step="0.5" inputmode="decimal">
    <div class="row">
      <div><label for="mt">Topo (mm)</label><input id="mt" type="number" min="0" max="60" value="25.5" step="0.5" inputmode="decimal"></div>
      <div><label for="ms">Lados (mm)</label><input id="ms" type="number" min="0" max="60" value="27.2" step="0.5" inputmode="decimal"></div>
      <div><label for="mb">Rodapé (mm)</label><input id="mb" type="number" min="0" max="60" value="31" step="0.5" inputmode="decimal"></div>
    </div>
    <label class="chk"><input id="just" type="checkbox" checked> Texto justificado</label>
    <label class="chk"><input id="cover" type="checkbox" checked> Capa em página cheia</label>
  </div>

  <div class="card" id="optP2E" hidden>
    <label class="chk"><input id="pCover" type="checkbox" checked> Primeira página como capa</label>
    <label class="chk"><input id="pImgs" type="checkbox" checked> Incluir imagens (figuras e páginas escaneadas)</label>
    <label class="chk"><input id="pHf" type="checkbox" checked> Remover cabeçalhos, rodapés e números de página</label>
  </div>

  <button id="go" disabled>Converter</button>
  <div id="status"></div>
  <ul id="list"></ul>
  <div id="outBtns">
    <button id="zipBtn" type="button">Baixar tudo em um ZIP</button>
    <button id="sepBtn" type="button" class="alt">Baixar todos os PDFs (sem ZIP)</button>
    <button id="shareBtn" type="button" class="alt" style="display:none">Compartilhar PDFs…</button>
  </div>
  <small id="note"></small>
</main>

<script>/*PDFLIB*/</script>
<script>/*FONTKIT*/</script>
<script>/*JSZIP*/</script>
<script>/*PDFJS*/</script>
<script type="text/plain" id="pdfWorker">/*PDFJSWORKER*/</script>
<script>const FONT_DATA = /*FONTS*/{};</script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const fileEl = $('file'), go = $('go'), statusEl = $('status'), listEl = $('list'),
        outBtns = $('outBtns'), zipBtn = $('zipBtn'), sepBtn = $('sepBtn'), shareBtn = $('shareBtn');
  let files = [], results = [], zipUrl = null, items = [], busy = false;
  const MODES = {
    e2p: { pick: 'Toque para escolher um ou mais .epub', accept: '.epub,application/epub+zip', ext: 'pdf', mime: 'application/pdf', many: 'PDFs',
           note: 'Os PDFs são gerados direto no app (sem tela de impressão), com as margens e o tamanho de página escolhidos. Nome do arquivo: Título em Title Case - Subtítulo (Autor). Se o Chrome perguntar, permita vários downloads.' },
    p2e: { pick: 'Toque para escolher um ou mais .pdf', accept: '.pdf,application/pdf', ext: 'epub', mime: 'application/epub+zip', many: 'EPUBs',
           note: 'O texto do PDF é remontado em parágrafos, com títulos, itálico, negrito, sumário (dos marcadores do PDF ou dos títulos) e imagens. Funciona melhor com livros e textos corridos; PDFs escaneados viram páginas em imagem. Nome do arquivo: Título em Title Case - Subtítulo (Autor). Se o Chrome perguntar, permita vários downloads.' },
  };
  let mode = location.hash === '#pdf-epub' ? 'p2e' : 'e2p';

  const say = (msg, err) => { statusEl.textContent = msg; statusEl.className = err ? 'err' : ''; };
  const tick = () => new Promise(r => setTimeout(r, 0));
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function renderList() {
    listEl.innerHTML = files.map(f => `<li><span class="n">${esc(f.name)}</span><span class="s">Na fila</span></li>`).join('');
    items = [...listEl.children];
  }
  const setItem = (i, text, cls, dl) => {
    const s = items[i].querySelector('.s');
    s.textContent = text; s.className = 's ' + (cls || '');
    if (dl) {
      items[i].querySelector('.n').textContent = dl.name;
      const a = document.createElement('a'); a.href = dl.url; a.download = dl.name; a.textContent = 'Baixar';
      s.appendChild(a);
    }
  };

  const pickFiles = list => {
    files = [...list].sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
    $('fname').textContent = files.length ? (files.length === 1 ? files[0].name : files.length + ' arquivos selecionados') : MODES[mode].pick;
    $('fmeta').textContent = files.length ? (files.reduce((s, f) => s + f.size, 0) / 1048576).toFixed(1) + ' MB no total' : '';
    go.disabled = !files.length;
    outBtns.style.display = 'none';
    renderList(); say('');
  };
  fileEl.addEventListener('change', () => pickFiles(fileEl.files));

  const setMode = m => {
    mode = m;
    document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
    $('optE2P').hidden = m !== 'e2p'; $('optP2E').hidden = m !== 'p2e';
    fileEl.accept = MODES[m].accept; fileEl.value = '';
    $('note').textContent = MODES[m].note;
    pickFiles([]);
  };
  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
    if (busy || b.dataset.mode === mode) return;
    history.replaceState(null, '', b.dataset.mode === 'p2e' ? '#pdf-epub' : location.pathname + location.search);
    setMode(b.dataset.mode);
  }));
  setMode(mode);

  // ---------- nome do arquivo: Title Case - Subtítulo (Autor) ----------
  const STOP = new Set(('a o as os um uns uma umas de do da dos das em no na nos nas num numa por pelo pela pelos pelas ' +
    'para pra com sem sob sobre ao aos à às e ou nem até entre perante após ante desde contra ' +
    'the an of and in on at to for but or nor by with from').split(' '));
  const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
  function titleCase(str) {
    const mixed = /\p{Ll}/u.test(str) && /\p{Lu}/u.test(str);
    const words = str.trim().split(/\s+/);
    return words.map((w, i) => w.split('-').map((part, j, arr) => {
      const core = part.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, '');
      if (!core) return part;
      const low = core.toLowerCase(), hasLower = /\p{Ll}/u.test(core), hasUpper = /\p{Lu}/u.test(core);
      let out;
      if (!(i === 0 && j === 0) && i < words.length - 1 && arr.length === 1 && STOP.has(low)) out = low;
      else if (!hasLower && hasUpper && mixed && core.length > 1 && core.length <= 5) out = core;   // sigla/romano já em maiúsculas
      else {
        const base = (!hasLower && hasUpper) ? low : core;
        const m = base.match(/^([dl]['’])(.+)$/i);                                 // d'Água
        out = m && !(i === 0 && j === 0) ? m[1].toLowerCase() + cap(m[2]) : cap(base);
      }
      return part.replace(core, out);
    }).join('-')).join(' ');
  }
  function cleanAuthors(raw) {   // um campo pode trazer vários autores; devolve lista de nomes
    const out = [];
    for (const piece of raw.replace(/\s+/g, ' ').trim().split(/\s*[;&/|+]\s*|\s+(?:and|e)\s+(?=\p{Lu})/u)) {
      if (!piece) continue;
      const parts = piece.split(/\s*,\s*/).filter(Boolean);
      const jr = p => /^(jr|sr|filho|neto|júnior|junior)\.?$/i.test(p);
      if (parts.length === 2 && parts[0].split(' ').length === 1 && !jr(parts[1])) out.push(parts[1] + ' ' + parts[0]);   // "Sobrenome, Nome"
      else if (parts.length > 1 && !parts.slice(1).some(jr)) out.push(...parts);                                         // lista separada por vírgula
      else out.push(piece);
    }
    return out.map(titleCase);
  }
  const bad = /[\\/:*?"<>|\u0000-\u001f]+/g;
  function makeName(title, authors) {
    const parts = title.split(/\s*:\s+|\s+[-–—]\s+|\s*[–—]\s*/).map(s => s.replace(bad, ' ').replace(/\s+/g, ' ').trim()).filter(Boolean);
    let name = (parts.length ? parts : ['Livro']).map(titleCase).join(' - ');
    let au = authors.flatMap(cleanAuthors).filter(Boolean);
    if (au.length > 3) au = [au[0] + ' et al.'];
    const suffix = au.length ? ` (${au.join(', ').replace(bad, ' ')})` : '';
    if (name.length + suffix.length > 190) name = name.slice(0, 190 - suffix.length).trim();
    return name + suffix;
  }

  // ---------- caminhos dentro do zip ----------
  const dirname = p => p.includes('/') ? p.slice(0, p.lastIndexOf('/') + 1) : '';
  function resolve(base, rel) {
    rel = rel.split('#')[0].split('?')[0];
    try { rel = decodeURIComponent(rel); } catch (e) {}
    const parts = (rel.startsWith('/') ? rel.slice(1) : dirname(base) + rel).split('/');
    const out = [];
    for (const p of parts) { if (p === '..') out.pop(); else if (p && p !== '.') out.push(p); }
    return out.join('/');
  }

  // ---------- constantes de página ----------
  const MM = 72 / 25.4;
  const PAGES = { letter: [612, 792], A4: [595.276, 841.89], A5: [419.528, 595.276] };
  const BLOCK = new Set(['p','div','h1','h2','h3','h4','h5','h6','li','blockquote','pre','section','article','aside',
    'header','footer','figure','figcaption','ul','ol','table','tr','dd','dt','dl','hr','body','nav','main','caption']);
  const SKIP = new Set(['head','script','style','title','meta','link','audio','video','iframe','object','embed','canvas','map']);

  // ---------- EPUB -> blocos ----------
  function buildBlocks(root, itemHref, blocks) {
    let cur = null;
    const trim = p => {
      const t = p.toks;
      while (t.length && t[0].sp) t.shift();
      while (t.length && t[t.length - 1].sp) t.pop();
    };
    const flush = () => { if (cur) { trim(cur); if (cur.toks.length) blocks.push(cur); cur = null; } };
    const ensure = ctx => {
      if (!cur) {
        let label = null;
        if (ctx.lab && !ctx.lab.used) { ctx.lab.used = true; label = ctx.lab.text; }
        cur = { t: 'p', kind: ctx.kind, align: ctx.align, quote: ctx.quote, label, pre: ctx.pre, toks: [] };
      }
      return cur;
    };
    const addSp = () => {
      if (!cur) return;
      const l = cur.toks[cur.toks.length - 1];
      if (l && !l.sp && !l.br) cur.toks.push({ sp: true });
    };
    const addWord = (w, ctx) => {
      const p = ensure(ctx);
      const l = p.toks[p.toks.length - 1];
      const part = { w, f: ctx.f, sup: ctx.sup };
      if (l && !l.sp && !l.br) l.parts.push(part); else p.toks.push({ parts: [part] });
    };
    const addText = (txt, ctx) => {
      txt = txt.replace(/[­​‌‍﻿]/g, '').replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, '');
      if (ctx.pre) {
        txt.split('\n').forEach((line, i) => {
          if (i) ensure(ctx).toks.push({ br: true });
          line.replace(/\s+/g, ' ').trim().split(' ').filter(Boolean).forEach((w, k) => { if (k) addSp(); addWord(w, ctx); });
        });
        return;
      }
      const s = txt.replace(/\s+/g, ' ');
      if (!s.trim()) { if (s && cur) addSp(); return; }
      if (s[0] === ' ') addSp();
      s.trim().split(' ').forEach((w, i) => { if (i) addSp(); addWord(w, ctx); });
      if (s.endsWith(' ')) addSp();
    };

    const walk = (node, ctx) => {
      if (node.nodeType === 3) { addText(node.nodeValue, ctx); return; }
      if (node.nodeType !== 1) return;
      const tag = (node.localName || node.nodeName).toLowerCase();
      if (SKIP.has(tag) || node.hasAttribute('hidden')) return;

      if (tag === 'img' || tag === 'image') {
        const v = node.getAttribute('src') || node.getAttribute('href') || node.getAttribute('xlink:href');
        if (v && !/^data:/i.test(v)) { flush(); blocks.push({ t: 'img', path: resolve(itemHref, v) }); }
        return;
      }
      if (tag === 'br') { if (cur) cur.toks.push({ br: true }); return; }
      if (tag === 'hr') { flush(); blocks.push({ t: 'hr' }); return; }

      let c = ctx;
      const style = node.getAttribute('style') || '', cls = node.getAttribute('class') || '';
      if (/text-align\s*:\s*center/i.test(style) || /center/i.test(cls) || node.getAttribute('align') === 'center') c = { ...c, align: 'center' };
      else if (/text-align\s*:\s*right/i.test(style) || /\bright\b/i.test(cls)) c = { ...c, align: 'right' };

      if (/^h[1-6]$/.test(tag)) {
        flush();
        walkKids(node, { ...c, kind: tag, f: c.f | 2, align: 'center' });
        flush(); return;
      }
      if (tag === 'em' || tag === 'i' || tag === 'cite' || tag === 'dfn' || tag === 'var') c = { ...c, f: c.f | 1 };
      else if (tag === 'strong' || tag === 'b') c = { ...c, f: c.f | 2 };
      else if (tag === 'sup') c = { ...c, sup: 1 };
      else if (tag === 'sub') c = { ...c, sup: -1 };
      else if (tag === 'td' || tag === 'th') { addSp(); walkKids(node, c); addSp(); return; }
      else if (tag === 'ul' || tag === 'ol') { flush(); walkKids(node, { ...c, list: { ol: tag === 'ol', n: 0 } }); flush(); return; }
      else if (tag === 'li') {
        flush();
        const L = c.list || { ol: false, n: 0 };
        L.n++;
        walkKids(node, { ...c, kind: 'li', lab: { text: L.ol ? L.n + '.' : '•', used: false } });
        flush(); return;
      }
      else if (tag === 'blockquote') { flush(); walkKids(node, { ...c, quote: c.quote + 1 }); flush(); return; }
      else if (tag === 'pre') { flush(); walkKids(node, { ...c, pre: true, align: 'left' }); flush(); return; }

      if (BLOCK.has(tag)) { flush(); walkKids(node, c); flush(); return; }
      walkKids(node, c);
    };
    const walkKids = (node, ctx) => { for (const ch of node.childNodes) walk(ch, ctx); };

    walkKids(root, { f: 0, sup: 0, kind: 'p', align: null, quote: 0, pre: false, list: null, lab: null });
    flush();
  }

  // ---------- conversão EPUB -> PDF ----------
  async function epubToPdf(file, say) {
    {
      say('Lendo o arquivo…'); await tick();
      const zip = await JSZip.loadAsync(file);
      const names = Object.keys(zip.files);
      const lower = new Map(names.map(n => [n.toLowerCase(), n]));
      const find = p => zip.file(p) || (lower.has(p.toLowerCase()) ? zip.file(lower.get(p.toLowerCase())) : null);
      const xml = (s, type = 'application/xml') => new DOMParser().parseFromString(s, type);

      const cont = find('META-INF/container.xml');
      if (!cont) throw new Error('Não parece um EPUB válido (sem container.xml).');
      const opfPath = xml(await cont.async('string')).querySelector('rootfile').getAttribute('full-path');
      const opf = xml(await find(opfPath).async('string'));

      const manifest = {};
      opf.querySelectorAll('manifest > item').forEach(it => {
        manifest[it.getAttribute('id')] = {
          href: resolve(opfPath, it.getAttribute('href')), type: it.getAttribute('media-type'),
          props: it.getAttribute('properties') || ''
        };
      });
      let spine = [...opf.querySelectorAll('spine > itemref')]
        .map(r => ({ id: r.getAttribute('idref'), linear: r.getAttribute('linear') !== 'no' }))
        .filter(r => manifest[r.id]);
      const linear = spine.filter(r => r.linear);
      if (linear.length) spine = linear;
      if (!spine.length) throw new Error('EPUB sem conteúdo no spine.');
      const meta = sel => { const e = opf.querySelector(sel); return e ? e.textContent.trim() : ''; };
      const title = meta('metadata > title, dc\\:title') || file.name.replace(/\.epub$/i, '');
      let creators = [...opf.querySelectorAll('metadata > creator, dc\\:creator')];
      const authorsOnly = creators.filter(c => { const r = c.getAttribute('opf:role'); return !r || r === 'aut'; });
      if (authorsOnly.length) creators = authorsOnly;
      const authors = creators.map(c => c.textContent.trim()).filter(Boolean);
      const author = authors.join(', ');

      // capa
      let coverPath = null;
      const ci = Object.values(manifest).find(m => /cover-image/.test(m.props));
      if (ci) coverPath = ci.href;
      else {
        const mc = opf.querySelector('meta[name=cover]');
        if (mc && manifest[mc.getAttribute('content')]) coverPath = manifest[mc.getAttribute('content')].href;
      }
      const isImg = m => /^image\//.test(m.type || '');
      if (!coverPath && opf.querySelector('meta[name=cover]')) {   // meta cover aponta para id inexistente: tenta pelo nome
        const cn = opf.querySelector('meta[name=cover]').getAttribute('content');
        const m = Object.values(manifest).find(m => isImg(m) && (m.href.toLowerCase().includes(cn.toLowerCase()) || /cover|capa/i.test(m.href)));
        if (m) coverPath = m.href;
      }
      if (!coverPath) {   // guide/reference type=cover -> 1ª imagem da página de capa
        const ref = opf.querySelector('guide > reference[type=cover]');
        if (ref) {
          const cp = resolve(opfPath, ref.getAttribute('href'));
          const cf = find(cp);
          if (cf) {
            const mm = (await cf.async('string')).match(/(?:src|href)\s*=\s*["']([^"']+\.(?:jpe?g|png|gif|webp|svg))["']/i);
            if (mm) coverPath = resolve(cp, mm[1]);
          }
        }
      }
      if (!coverPath) {   // último recurso: imagem do manifesto com "cover"/"capa" no nome
        const m = Object.values(manifest).find(m => isImg(m) && /(^|[\/_.-])(cover|capa)\b/i.test(m.href));
        if (m) coverPath = m.href;
      }

      // conteúdo -> blocos
      const blocks = [];
      for (let i = 0; i < spine.length; i++) {
        say(`Lendo capítulo ${i + 1} de ${spine.length}…`); await tick();
        const item = manifest[spine[i].id];
        const f = find(item.href);
        if (!f) continue;
        const raw = await f.async('string');
        let doc = xml(raw, /html/.test(item.type) ? 'application/xhtml+xml' : 'text/html');
        if (doc.querySelector('parsererror')) doc = new DOMParser().parseFromString(raw, 'text/html');
        const root = doc.querySelector('body') || doc.documentElement;
        blocks.push({ t: 'chap' });
        buildBlocks(root, item.href, blocks);
      }
      const useCover = $('cover').checked && coverPath;
      if (useCover) {  // a capa vira a 1ª página; remove a repetição nos primeiros capítulos
        let chaps = 0;
        for (let i = 0; i < blocks.length; i++) {

            const gap = prevEnd === null ? 0 : r.x - prevEnd;
            let sp = last && gap > 0.15 * Math.min(r.size, L.size) && !/\s$/.test(last.t) && !/^\s/.test(run.t);
            if (last && last.b === run.b && last.i === run.i && last.sup === run.sup) last.t += (sp ? ' ' : '') + run.t;
            else { if (sp) last.t += ' '; L.runs.push(run); }
            prevEnd = r.x + r.w;
          }
          L.runs.forEach(r => r.t = r.t.replace(/\s+/g, ' '));
          L.runs[0].t = L.runs[0].t.replace(/^\s+/, '');
          L.runs[L.runs.length - 1].t = L.runs[L.runs.length - 1].t.replace(/\s+$/, '');
          L.runs = L.runs.filter(r => r.t);
          L.text = L.runs.map(r => r.t).join('');
          L.bold = L.runs.every(r => r.b || !r.t.trim());
          L.top = L.y - L.size;
        }
      }
      pages.push({ pn, vp, W, H, lines: lines.filter(L => L.text), figs });
      page.cleanup();
    }

    // 2) cabeçalhos, rodapés e números de página
    const allLines = () => pages.flatMap(P => P.lines);
    if (dropHf && N > 1) {
      const key = L => L.text.toLowerCase().replace(/\d+/g, '#').replace(/\s+/g, ' ').trim();
      const zone = (P, L) => L.y < P.H * 0.1 ? 't' : L.top > P.H * 0.9 ? 'b' : null;
      const freq = new Map();
      for (const P of pages) for (const k of new Set(P.lines.filter(L => zone(P, L)).map(L => zone(P, L) + key(L)))) freq.set(k, (freq.get(k) || 0) + 1);
      const min = Math.max(3, N * 0.25);
      for (const P of pages) P.lines = P.lines.filter(L => {
        const z = zone(P, L);
        if (!z) return true;
        if (/^[\W\d_]*$|^\W*[ivxlcdm]+\W*$/i.test(L.text) && L.text.length < 12) return false;   // só número de página
        return !(freq.get(z + key(L)) >= min && N >= 3);
      });
    }
    const lines = allLines();
    if (!lines.length && !pages.some(P => P.figs.length) && !cover) throw new Error('Não encontrei texto nem imagens neste PDF.');

    // 3) medidas do texto principal
    const sizeChars = new Map();
    for (const L of lines) { const k = Math.round(L.size * 2) / 2; sizeChars.set(k, (sizeChars.get(k) || 0) + L.text.length); }
    const body = lines.length ? [...sizeChars.entries()].sort((a, b) => b[1] - a[1])[0][0] : 10;
    const cls = L => L.size >= body * 1.12 ? 'h' : L.size < body * 0.88 ? 's' : 'b';
    const pitches = [];
    for (const P of pages) for (let i = 1; i < P.lines.length; i++) {
      const A = P.lines[i - 1], B = P.lines[i];
      if (cls(A) === 'b' && cls(B) === 'b' && B.y > A.y) { const r = (B.y - A.y) / B.size; if (r < 3) pitches.push(r); }
    }
    const pitch = median(pitches) || 1.2;
    for (const P of pages) for (const L of P.lines) {   // borda direita da coluna de cada linha
      const col = P.lines.filter(X => Math.abs(X.x0 - L.x0) < 4 * body);
      L.right = Math.max(...col.map(X => X.x1)); L.left = Math.min(...col.map(X => X.x0));
      L.short = col.length >= 3 && L.x1 < L.right - 0.1 * (L.right - L.left);
    }
    const words = new Set();
    for (const L of lines) for (const w of L.text.toLowerCase().split(/[^\p{L}\p{N}-]+/u)) if (w) words.add(w);

    // 4) linhas -> blocos (parágrafos, títulos, figuras, notas)
    const blocks = [];
    let cur = null, P = null, notes = [];
    const close = () => { if (cur) blocks.push(cur); cur = null; if (notes.length) { blocks.push(...notes); notes = []; } };
    const append = (B, L) => {
      const last = B.runs[B.runs.length - 1];
      if (last) {
        const m = last.t.match(/(\p{L}+)-$/u), first = (L.text.match(/^\p{L}+/u) || [''])[0];
        if (m && /^\p{Ll}/u.test(first) && !CLITIC.has(first.toLowerCase()) && (words.has((m[1] + first).toLowerCase()) || !words.has((m[1] + '-' + first).toLowerCase())))
          last.t = last.t.slice(0, -1);   // hifenização de fim de linha
        else if (!/[\s/–—-]$/.test(last.t) || /\s-$/.test(last.t)) last.t += ' ';
      }
      for (const r of L.runs) {
        const l = B.runs[B.runs.length - 1];
        if (l && l.b === r.b && l.i === r.i && l.sup === r.sup) l.t += r.t; else B.runs.push({ ...r });
      }
      B.lines.push(L);
    };
    const sameFlow = (A, B) => A.page === B.page && B.y > A.y && B.y - A.y < pitch * Math.max(A.size, B.size) * 1.45;
    const startsNew = (L, Nx) => {
      if (!cur || !P) return true;
      const a = cls(P), b = cls(L), s = L.size;
      if (a !== b) return true;
      if (b === 'h') return !(P.page === L.page && L.y > P.y && L.y - P.y < 2.2 * s && Math.abs(P.size - L.size) < 0.1 * s);
      if (LIST_START.test(L.text)) return true;
      const flow = P.page === L.page && L.y > P.y;
      if (flow && L.y - P.y > pitch * Math.max(P.size, s) * 1.45) return true;
      if (flow && L.x0 - P.x0 > 0.6 * s && L.x0 - P.x0 < 0.25 * L.right) return true;          // recuo de 1ª linha
      if (flow && cur.lines.length >= 2 && P.x0 - L.x0 > 0.6 * s) return true;                    // fim de citação recuada
      if (Nx && sameFlow(L, Nx) && L.x0 - Nx.x0 > 0.6 * s && L.x0 - Nx.x0 < 0.25 * L.right) return true;
      if (P.short && SENT_END.test(P.text)) return true;
      return false;
    };
    for (const pg of pages) {
      const ls = pg.lines;
      // notas de rodapé: bloco final de linhas pequenas na metade de baixo da página
      let k = ls.length;
      while (k > 0 && cls(ls[k - 1]) === 's' && ls[k - 1].y > pg.H * 0.55) k--;
      const bodyLines = ls.slice(0, k), noteLines = ls.slice(k);
      const seq = [...bodyLines];
      for (const f of pg.figs) {
        const at = seq.findIndex(x => !x.t && x.top >= f.top - 1);
        seq.splice(at < 0 ? seq.length : at, 0, f);
      }
      for (let i = 0; i < seq.length; i++) {
        const L = seq[i];
        if (L.t === 'img') { close(); blocks.push({ ...L, pageNo: pg.pn, top: L.top }); P = null; continue; }
        if (startsNew(L, seq[i + 1] && !seq[i + 1].t ? seq[i + 1] : null)) {
          close();
          cur = { t: cls(L) === 'h' ? 'h' : 'p', small: cls(L) === 's', runs: [], lines: [], pageNo: pg.pn, top: L.top };
        }
        append(cur, L); P = L;
      }
      for (const L of noteLines) {
        if (!notes.length || /^(\d+|[*†‡§])/.test(L.text) || notes[notes.length - 1].lines[0].page !== L.page)
          notes.push({ t: 'p', small: true, runs: [], lines: [], pageNo: pg.pn, top: L.top });
        append(notes[notes.length - 1], L);
      }
    }
    close();

    // capitulares (letra grande isolada) voltam para o parágrafo seguinte
    for (let i = blocks.length - 2; i >= 0; i--) {
      const B = blocks[i], C = blocks[i + 1];
      if (B.t === 'h' && C.t === 'p' && /^\p{L}{1,2}$/u.test(B.runs.map(r => r.t).join('').trim())) {
        C.runs.unshift({ t: B.runs.map(r => r.t).join('').trim(), b: false, i: false, sup: false });
        blocks.splice(i, 1);
      }
    }
    // níveis de título por tamanho; título longo demais vira parágrafo
    const hs = [...new Set(blocks.filter(B => B.t === 'h').map(B => Math.round(Math.max(...B.lines.map(L => L.size)))))].sort((a, b) => b - a);
    for (const B of blocks) {
      if (B.t === 'h') {
        if (B.runs.map(r => r.t).join('').split(' ').length > 30) { B.t = 'p'; continue; }
        B.lvl = Math.min(3, hs.indexOf(Math.round(Math.max(...B.lines.map(L => L.size)))) + 1);
      } else if (B.t === 'p' && !B.small && B.lines.length === 1 && B.lines[0].bold) {
        const t = B.runs.map(r => r.t).join('').trim();
        if (t.split(' ').length <= 12 && !/[.,;:]$/.test(t)) { B.t = 'h'; B.lvl = Math.min(4, hs.length + 1); }   // linha isolada em negrito
      }
      if (B.t === 'p' && B.lines.length) {
        const L0 = B.lines[0], w = L0.right - L0.left;
        B.center = B.lines.every(L => L.x0 - L.left > Math.max(2 * L.size, 0.06 * w) && Math.abs((L.x0 - L.left) - (L.right - L.x1)) < Math.max(2 * L.size, 0.05 * w));
        B.quote = !B.center && B.lines.every(L => L.x0 - L.left > 1.5 * L.size) && B.lines.length > 1;
      }
    }

    // 5) capítulos e sumário: marcadores do PDF; se não houver, os títulos
    const toc = [];
    try {
      const outline = await doc.getOutline();
      const walkOut = async (list, level) => {
        for (const it of list || []) {
          let dest = it.dest, pageIdx = null, top = null;
          try {
            if (typeof dest === 'string') dest = await doc.getDestination(dest);
            if (Array.isArray(dest) && dest[0] != null) {
              pageIdx = typeof dest[0] === 'object' ? await doc.getPageIndex(dest[0]) : dest[0];
              const kind = dest[1] && dest[1].name, t = kind === 'XYZ' ? dest[3] : /^FitB?H$/.test(kind) ? dest[2] : kind === 'FitR' ? dest[5] : null;
              if (typeof t === 'number' && pages[pageIdx]) top = pages[pageIdx].vp.convertToViewportPoint(0, t)[1];
            }
          } catch (e) {}
          const title = (it.title || '').replace(/\s+/g, ' ').trim();
          if (title && pageIdx != null && pageIdx >= 0 && pageIdx < N) toc.push({ title, level, pageNo: pageIdx + 1, top });
          if (level < 3) await walkOut(it.items, level + 1);
        }
      };
      await walkOut(outline, 0);
    } catch (e) { console.warn('sem marcadores', e); }

    const norm = t => t.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
    const textOf = B => B.runs ? B.runs.map(r => r.t).join('') : '';
    const posOf = e => {   // título com o mesmo texto na página; senão, o primeiro bloco abaixo do ponto marcado
      const t = norm(e.title);
      const h = blocks.findIndex(B => B.pageNo === e.pageNo && B.t === 'h' && t && (norm(textOf(B)) === t || norm(textOf(B)).includes(t) || t.includes(norm(textOf(B)))));
      if (h >= 0) return h;
      return blocks.findIndex(B => B.pageNo > e.pageNo || (B.pageNo === e.pageNo && (e.top == null || B.top >= e.top - 2 * body)));
    };
    let entries = [], breaks = new Set();
    if (toc.length) {
      const base = toc.filter(e => e.level === 0).length === 1 && toc.some(e => e.level === 1) ? 1 : 0;
      entries = toc.filter(e => e.level >= base && e.level <= base + 1).map(e => ({ ...e, level: e.level - base, at: posOf(e) })).filter(e => e.at >= 0);
      entries.filter(e => e.level === 0).forEach(e => breaks.add(e.at));
    } else {
      let lvl = 0;
      for (let l = 1; l <= 4 && !lvl; l++) if (blocks.filter(B => B.t === 'h' && B.lvl === l).length >= 2) lvl = l;
      if (lvl) blocks.forEach((B, i) => {
        if (B.t === 'h' && B.lvl <= lvl + 1) entries.push({ title: B.runs.map(r => r.t).join('').trim(), level: B.lvl <= lvl ? 0 : 1, at: i });
        if (B.t === 'h' && B.lvl <= lvl) breaks.add(i);
      });
    }

    // 6) metadados
    let info = {};
    try { info = (await doc.getMetadata()).info || {}; } catch (e) {}
    const clean = v => typeof v === 'string' ? v.replace(/\s+/g, ' ').trim() : '';
    let title = clean(info.Title);
    if (!title || title.length < 2 || /^(microsoft (word|powerpoint) - |untitled|sem t[ií]tulo)|\.(docx?|pdf|indd|tex|dvi|qxd|odt|rtf)$/i.test(title))
      title = file.name.replace(/\.pdf$/i, '').replace(/[_]+/g, ' ').trim();
    const authors = clean(info.Author) ? cleanAuthors(clean(info.Author)) : [];
    const lang = guessLang(' ' + lines.slice(0, 2000).map(L => L.text).join(' ') + ' ');

    // 7) XHTML
    say('Montando o EPUB…'); await tick();
    const runsHtml = runs => runs.map(r => {
      let h = xesc(r.t);
      if (r.sup) h = `<sup>${h}</sup>`;
      if (r.i) h = `<i>${h}</i>`;
      if (r.b) h = `<b>${h}</b>`;
      return h;
    }).join('').replace(/<\/(b|i|sup)><\1>/g, '');
    const files = [];   // { name, title, html }
    let curFile = null, fileOf = new Array(blocks.length), afterBreak = true;
    const newFile = () => { curFile = { name: `c${String(files.length + 1).padStart(3, '0')}.xhtml`, html: [] }; files.push(curFile); afterBreak = true; };
    const ids = new Map(entries.map((e, k) => [e.at, 'p' + k]));
    blocks.forEach((B, i) => {
      if (!curFile || (breaks.has(i) && curFile.html.length) || (curFile.size > 200000 && B.t === 'p')) newFile();
      fileOf[i] = curFile.name;
      const id = ids.has(i) ? ` id="${ids.get(i)}"` : '';
      let h;
      if (B.t === 'img') h = `<div class="${B.page ? 'pg' : 'fig'}"${id}><img src="${B.src}" alt=""/></div>`;
      else if (B.t === 'h') h = `<h${B.lvl}${id}>${runsHtml(B.runs.map(r => ({ ...r, b: false })))}</h${B.lvl}>`;
      else {
        const c = [B.small && 's', B.center && 'c', B.quote && 'q', afterBreak && 'f'].filter(Boolean).join(' ');
        h = `<p${id}${c ? ` class="${c}"` : ''}>${runsHtml(B.runs)}</p>`;
      }
      afterBreak = B.t !== 'p';
      curFile.html.push(h); curFile.size = (curFile.size || 0) + h.length;
      if (!curFile.title && B.t === 'h') curFile.title = B.runs.map(r => r.t).join('').trim();
    });
    if (!files.length) newFile();
    const page = (t, bodyHtml, extra = '') => `<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops" xml:lang="${lang}" lang="${lang}">
<head><meta charset="utf-8"/><title>${xesc(t)}</title><link rel="stylesheet" type="text/css" href="style.css"/>${extra}</head>
<body>
${bodyHtml}
</body>
</html>`;

    // sumário
    const nav = entries.length ? entries : [{ title, level: 0, at: 0 }];
    const href = e => (fileOf[e.at] || files[0].name) + (ids.has(e.at) && breaks.has(e.at) === false ? '#' + ids.get(e.at) : '');
    const tree = [];
    for (const e of nav) { if (e.level === 0 || !tree.length) tree.push({ e, kids: [] }); else tree[tree.length - 1].kids.push({ e, kids: [] }); }
    const navOl = list => `<ol>${list.map(n => `<li><a href="${href(n.e)}">${xesc(n.e.title)}</a>${n.kids.length ? navOl(n.kids) : ''}</li>`).join('')}</ol>`;
    let order = 0;
    const ncx = list => list.map(n => `<navPoint id="n${++order}" playOrder="${order}"><navLabel><text>${xesc(n.e.title)}</text></navLabel><content src="${href(n.e)}"/>${ncx(n.kids)}</navPoint>`).join('');
    const tocName = { pt: 'Sumário', en: 'Contents', es: 'Índice' }[lang];

    // 8) pacote
    const id = 'urn:uuid:' + uuid();
    const zip = new JSZip();
    zip.file('mimetype', 'application/epub+zip', { compression: 'STORE' });
    zip.file('META-INF/container.xml', `<?xml version="1.0" encoding="UTF-8"?>
<container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container"><rootfiles><rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/></rootfiles></container>`);
    zip.file('OEBPS/style.css', `body { margin: 0 4%; line-height: 1.45; }
p { margin: 0; text-indent: 1.5em; text-align: justify; }
p.f, p.c, p.s { text-indent: 0; }
p.c { text-align: center; }
p.q { margin: .4em 2em; text-indent: 0; }
p.s { font-size: .85em; margin-top: .3em; text-align: left; }
h1, h2, h3, h4 { text-align: center; line-height: 1.25; margin: 1.6em 0 .8em; page-break-after: avoid; }
h1 { font-size: 1.6em; } h2 { font-size: 1.35em; } h3 { font-size: 1.15em; } h4 { font-size: 1em; }
sup { font-size: .7em; line-height: 0; }
.fig { text-align: center; margin: 1em 0; }
.fig img { max-width: 100%; }
.pg { text-align: center; margin: 0; page-break-before: always; page-break-after: always; }
.pg img, .cover img { max-width: 100%; max-height: 100%; }
.cover { text-align: center; margin: 0; padding: 0; }
`);
    const man = [], spine = [];
    if (cover) {
      zip.file('OEBPS/' + cover.name, cover.bytes);
      man.push(`<item id="cover-img" href="${cover.name}" media-type="image/jpeg" properties="cover-image"/>`);
      zip.file('OEBPS/capa.xhtml', page(title, `<div class="cover"><img src="${cover.name}" alt="${xesc(title)}"/></div>`, '<style>body{margin:0}</style>'));
      man.push('<item id="capa" href="capa.xhtml" media-type="application/xhtml+xml"/>');
      spine.push('<itemref idref="capa"/>');
    }
    images.forEach((im, i) => { zip.file('OEBPS/' + im.name, im.bytes); man.push(`<item id="i${i + 1}" href="${im.name}" media-type="image/jpeg"/>`); });
    files.forEach((f, i) => {
      zip.file('OEBPS/' + f.name, page(f.title || title, f.html.join('\n')));
      man.push(`<item id="x${i + 1}" href="${f.name}" media-type="application/xhtml+xml"/>`);
      spine.push(`<itemref idref="x${i + 1}"/>`);
    });
    zip.file('OEBPS/nav.xhtml', page(tocName, `<nav epub:type="toc" id="toc"><h1>${tocName}</h1>${navOl(tree)}</nav>`));
    zip.file('OEBPS/toc.ncx', `<?xml version="1.0" encoding="UTF-8"?>
<ncx xmlns="http://www.daisy.org/z3986/2005/ncx/" version="2005-1"><head><meta name="dtb:uid" content="${id}"/></head><docTitle><text>${xesc(title)}</text></docTitle><navMap>${ncx(tree)}</navMap></ncx>`);
    zip.file('OEBPS/content.opf', `<?xml version="1.0" encoding="UTF-8"?>
<package xmlns="http://www.idpf.org/2007/opf" version="3.0" unique-identifier="uid" xml:lang="${lang}">
<metadata xmlns:dc="http://purl.org/dc/elements/1.1/">
<dc:identifier id="uid">${id}</dc:identifier>
<dc:title>${xesc(title)}</dc:title>
${authors.map(a => `<dc:creator>${xesc(a)}</dc:creator>`).join('\n')}
<dc:language>${lang}</dc:language>
<meta property="dcterms:modified">${new Date().toISOString().replace(/\.\d+Z$/, 'Z')}</meta>
${cover ? '<meta name="cover" content="cover-img"/>' : ''}
</metadata>
<manifest>
<item id="nav" href="nav.xhtml" media-type="application/xhtml+xml" properties="nav"/>
<item id="ncx" href="toc.ncx" media-type="application/x-dtbncx+xml"/>
<item id="css" href="style.css" media-type="text/css"/>
${man.join('\n')}
</manifest>
<spine toc="ncx">
${spine.join('\n')}
</spine>
</package>`);
    say('Gerando o EPUB…'); await tick();
    const bytes = await zip.generateAsync({ type: 'uint8array', compression: 'DEFLATE', mimeType: 'application/epub+zip' });
    return { bytes, pages: N, chapters: files.length, title, authors };
  }

  // ---------- lote ----------
  const save = (url, name) => { const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); };

  async function runBatch() {
    busy = true; go.disabled = true; fileEl.disabled = true; outBtns.style.display = 'none';
    const M = MODES[mode], convert = mode === 'p2e' ? pdfToEpub : epubToPdf;
    results.forEach(r => URL.revokeObjectURL(r.url)); if (zipUrl) URL.revokeObjectURL(zipUrl);
    results = []; zipUrl = null; renderList();
    const used = new Map();
    for (let i = 0; i < files.length; i++) {
      say(`Convertendo ${i + 1} de ${files.length}…`);
      try {
        const r = await convert(files[i], m => setItem(i, m));
        let base = makeName(r.title, r.authors), name = base, n = 1;
        while (used.has(name.toLowerCase())) name = `${base} (${++n})`;
        used.set(name.toLowerCase(), 1);
        name += '.' + M.ext;
        const url = URL.createObjectURL(new Blob([r.bytes], { type: M.mime }));
        results.push({ name, url, bytes: r.bytes, mime: M.mime });
        const info = r.chapters ? `${r.chapters} ${r.chapters > 1 ? 'capítulos' : 'capítulo'}` : `${r.pages} páginas`;
        setItem(i, `✓ ${info} · ${(r.bytes.length / 1048576).toFixed(1)} MB`, 'ok', { name, url });
      } catch (e) {
        console.error(e);
        setItem(i, 'Erro: ' + (e.message || e), 'err');
      }
      await tick();
    }
    if (results.length) {
      if (results.length > 1) {
        say('Montando o ZIP…'); await tick();
        const z = new JSZip();
        results.forEach(r => z.file(r.name, r.bytes, { compression: 'STORE' }));
        zipUrl = URL.createObjectURL(await z.generateAsync({ type: 'blob', compression: 'STORE' }));
      }
      zipBtn.style.display = results.length > 1 ? '' : 'none';
      sepBtn.textContent = sepBtn.dataset.label = results.length > 1 ? `Baixar todos os ${M.many} (sem ZIP)` : `Baixar o ${M.ext.toUpperCase()}`;
      sepBtn.className = results.length > 1 ? 'alt' : '';
      outBtns.style.display = 'block';
      shareBtn.textContent = `Compartilhar ${M.many}…`;
      shareBtn.style.display = canShare(results.map(r => new File([new Uint8Array(1)], r.name, { type: r.mime }))) ? '' : 'none';
    }
    const fail = files.length - results.length;
    say(`Pronto: ${results.length} convertido(s)${fail ? `, ${fail} com erro` : ''}. Toque em baixar.`, !results.length);
    busy = false; go.disabled = false; fileEl.disabled = false;
  }

  const canShare = fl => { try { return !!(navigator.canShare && navigator.canShare({ files: fl })); } catch (e) { return false; } };
  shareBtn.addEventListener('click', async () => {
    try { await navigator.share({ files: results.map(r => new File([r.bytes], r.name, { type: r.mime })) }); }
    catch (e) { if (e.name !== 'AbortError') say('Não foi possível compartilhar: ' + (e.message || e), true); }
  });
  zipBtn.addEventListener('click', () => { if (zipUrl) save(zipUrl, `${results[0].mime === 'application/pdf' ? 'PDFs' : 'EPUBs'} (${results.length} livros).zip`); });
  sepBtn.addEventListener('click', async () => {
    sepBtn.disabled = true;
    for (let i = 0; i < results.length; i++) {
      sepBtn.textContent = `Baixando ${i + 1} de ${results.length}…`;
      save(results[i].url, results[i].name);
      await new Promise(res => setTimeout(res, 900));
    }
    sepBtn.disabled = false; sepBtn.textContent = sepBtn.dataset.label;
  });
  go.addEventListener('click', runBatch);
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
