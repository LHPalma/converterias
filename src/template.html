<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Converterias</title>
<meta name="description" content="Conversor de coisas: converte arquivos 100% local, direto no navegador (EPUB para PDF, PDF para EPUB, juntar PDFs ou EPUBs e imagens para PDF e vice-versa).">
<meta name="theme-color" content="#2f6fed">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root { --bg:#fafafa; --fg:#1b1b1f; --muted:#666; --card:#fff; --accent:#2f6fed; --border:#ddd; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141416; --fg:#ececf0; --muted:#9a9aa5; --card:#1e1e22; --accent:#6c9bff; --border:#33333a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:480px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 20px; font-size:.9rem; }
  h2 { font-size:1.05rem; margin:0 0 10px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:16px; }
  label { display:block; font-size:.85rem; color:var(--muted); margin:12px 0 4px; }
  label.chk { display:flex; gap:8px; align-items:center; margin:12px 0 0; color:var(--fg); }
  label.chk input { width:auto; }
  select, input[type=number], input[type=text] { width:100%; padding:10px; font-size:1rem; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--fg); }
  .row { display:flex; gap:12px; } .row > div { flex:1; }
  button { width:100%; padding:14px; font-size:1rem; font-weight:600; border:0; border-radius:10px; background:var(--accent); color:#fff; }
  button:disabled { opacity:.5; }
  #drop { display:block; text-align:center; padding:28px 12px; border:2px dashed var(--border); border-radius:12px; color:var(--muted); cursor:pointer; margin:0; }
  #drop strong { display:block; color:var(--fg); margin-bottom:4px; word-break:break-word; }
  input[type=file] { display:none; }
  #status { min-height:1.4em; font-size:.9rem; color:var(--muted); margin-top:12px; }
  #status.err { color:#d33; }
  #list { list-style:none; margin:12px 0 0; padding:0; }
  #list li { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:8px; font-size:.85rem; word-break:break-word; }
  #list .n { display:block; font-weight:600; }
  #list li::after { content:''; display:block; clear:both; } #list .th { float:left; width:44px; height:44px; object-fit:cover; border-radius:6px; margin-right:10px; }
  #list .s { color:var(--muted); }
  #list .s.ok { color:#2a8a3e; } #list .s.err { color:#d33; }
  #list a { color:var(--accent); font-weight:600; margin-left:8px; }
  #outBtns { display:none; margin-top:12px; } #outBtns button { margin-bottom:8px; }
  button.alt { background:transparent; color:var(--accent); border:2px solid var(--accent); }
  small { color:var(--muted); display:block; margin-top:14px; font-size:.8rem; }
  .tabs { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  #list .mv { display:flex; gap:6px; margin-top:6px; } #list .mv button { width:auto; padding:4px 12px; font-size:.9rem; background:transparent; color:var(--accent); border:1px solid var(--accent); }
  .tabs button { flex:1 1 28%; padding:10px; background:transparent; color:var(--accent); border:2px solid var(--accent); }
  .tabs button.on { background:var(--accent); color:#fff; }
</style>
</head>
<body>
<main>
  <h1>Converterias</h1>
  <p class="sub">Conversor de coisas, 100% local. Nada sai do seu aparelho.</p>

  <div class="tabs">
    <button type="button" data-mode="e2p" class="on">EPUB → PDF</button>
    <button type="button" data-mode="p2e">PDF → EPUB</button>
    <button type="button" data-mode="merge">Juntar</button>
    <button type="button" data-mode="i2p">Imagens → PDF</button>
    <button type="button" data-mode="p2i">PDF → Imagens</button>
  </div>
  <div class="card">
    <label id="drop" for="file"><strong id="fname">Toque para escolher um ou mais .epub</strong><span id="fmeta"></span></label>
    <input id="file" type="file" multiple accept=".epub,application/epub+zip">
  </div>

  <div class="card" id="optE2P">
    <label for="size">Tamanho da página</label>
    <select id="size">
      <option value="letter">Carta (como o PDF de referência)</option>
      <option value="A4">A4</option>
      <option value="A5">A5 (bom para ler no celular)</option>
    </select>
    <label for="font">Fonte (pt)</label>
    <input id="font" type="number" min="6" max="30" value="15" step="0.5" inputmode="decimal">
    <div class="row">
      <div><label for="mt">Topo (mm)</label><input id="mt" type="number" min="0" max="60" value="25.5" step="0.5" inputmode="decimal"></div>
      <div><label for="ms">Lados (mm)</label><input id="ms" type="number" min="0" max="60" value="27.2" step="0.5" inputmode="decimal"></div>
      <div><label for="mb">Rodapé (mm)</label><input id="mb" type="number" min="0" max="60" value="31" step="0.5" inputmode="decimal"></div>
    </div>
    <label class="chk"><input id="just" type="checkbox" checked> Texto justificado</label>
    <label class="chk"><input id="cover" type="checkbox" checked> Capa em página cheia</label>
  </div>

  <div class="card" id="optP2E" hidden>
    <label class="chk"><input id="pCover" type="checkbox" checked> Primeira página como capa</label>
    <label class="chk"><input id="pImgs" type="checkbox" checked> Incluir imagens (figuras e páginas escaneadas)</label>
    <label class="chk"><input id="pHf" type="checkbox" checked> Remover cabeçalhos, rodapés e números de página</label>
  </div>

  <div class="card" id="optMerge" hidden>
    <label for="mTitle">Título do arquivo final (opcional)</label>
    <input id="mTitle" type="text" placeholder="Se vazio, uso a parte comum dos nomes">
    <small style="margin-top:8px">Junte só PDFs ou só EPUBs. A ordem é a da lista: use ↑ e ↓ para mudar.</small>
  </div>

  <div class="card" id="optI2P" hidden>
    <label for="iTitle">Título do PDF (opcional)</label>
    <input id="iTitle" type="text" placeholder="Se vazio, uso o nome das imagens">
    <div class="row">
      <div><label for="iSize">Tamanho da página</label>
        <select id="iSize"><option value="A4">A4</option><option value="letter">Carta</option><option value="fit">Do tamanho da imagem</option></select></div>
      <div><label for="iMargin">Margem</label>
        <select id="iMargin"><option value="0">Nenhuma</option><option value="10">Pequena</option><option value="20">Média</option></select></div>
    </div>
    <small style="margin-top:8px">Cada imagem vira uma página, na ordem da lista (use ↑ e ↓). JPEG e PNG entram sem perda; outros formatos passam pelo navegador.</small>
  </div>

  <div class="card" id="optP2I" hidden>
    <div class="row">
      <div><label for="xFmt">Formato</label>
        <select id="xFmt"><option value="png">PNG (sem perda)</option><option value="jpg">JPEG (menor)</option></select></div>
      <div><label for="xDpi">Resolução</label>
        <select id="xDpi"><option value="72">72 dpi (tela)</option><option value="100">100 dpi</option><option value="150" selected>150 dpi</option><option value="200">200 dpi</option><option value="300">300 dpi (impressão)</option></select></div>
    </div>
    <label for="xPages">Páginas (opcional)</label>
    <input id="xPages" type="text" placeholder="Todas. Ou: 1-5, 8, 10-12" autocomplete="off">
  </div>

  <button id="go" disabled>Converter</button>
  <button id="cancel" type="button" class="alt" style="display:none;margin-top:8px">Cancelar</button>
  <div id="status"></div>
  <ul id="list"></ul>
  <div id="outBtns">
    <button id="zipBtn" type="button">Baixar tudo em um ZIP</button>
    <button id="sepBtn" type="button" class="alt">Baixar todos os PDFs (sem ZIP)</button>
    <button id="shareBtn" type="button" class="alt" style="display:none">Compartilhar PDFs…</button>
  </div>
  <small id="note"></small>
</main>

<script>const FONT_DATA = /*FONTS*/{};</script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const fileEl = $('file'), go = $('go'), statusEl = $('status'), listEl = $('list'),
        outBtns = $('outBtns'), zipBtn = $('zipBtn'), sepBtn = $('sepBtn'), shareBtn = $('shareBtn');
  let files = [], results = [], thumbs = [], zipUrl = null, items = [], busy = false;
  const MODES = {
    e2p: { pick: 'Toque para escolher um ou mais .epub', accept: '.epub,application/epub+zip', ext: 'pdf', mime: 'application/pdf', many: 'PDFs',
           note: 'Os PDFs são gerados direto no app (sem tela de impressão), com as margens e o tamanho de página escolhidos. Nome do arquivo: Título em Title Case - Subtítulo (Autor). Se o Chrome perguntar, permita vários downloads.' },
    p2e: { pick: 'Toque para escolher um ou mais .pdf', accept: '.pdf,application/pdf', ext: 'epub', mime: 'application/epub+zip', many: 'EPUBs',
           note: 'O texto do PDF é remontado em parágrafos, com títulos, itálico, negrito, sumário (dos marcadores do PDF ou dos títulos) e imagens. Funciona melhor com livros e textos corridos; PDFs escaneados viram páginas em imagem. Nome do arquivo: Título em Title Case - Subtítulo (Autor). Se o Chrome perguntar, permita vários downloads.' },
    i2p: { pick: 'Toque para escolher as imagens (JPG, PNG, WebP…)', accept: 'image/*,.jpg,.jpeg,.png,.webp,.gif,.bmp,.avif', ext: 'pdf', mime: 'application/pdf', many: 'PDFs',
           note: 'Junta imagens em um PDF, uma por página, na ordem da lista. JPEG e PNG entram sem recompressão; fotos giradas pelo celular (EXIF) saem na posição certa. Dá para escolher imagens em várias vezes.' },
    p2i: { pick: 'Toque para escolher um ou mais .pdf', accept: '.pdf,application/pdf', ext: 'png', mime: 'image/png', many: 'imagens',
           note: 'Cada página do PDF vira uma imagem, nomeada Arquivo - 001.png. Com mais de uma imagem você baixa tudo em um ZIP. Resoluções altas em PDFs grandes consomem bastante memória do aparelho.' },
    merge: { pick: 'Toque para escolher os PDFs ou EPUBs a juntar', accept: '.pdf,.epub,application/pdf,application/epub+zip', ext: '', mime: '', many: '',
             note: 'Junta vários PDFs em um PDF, ou vários EPUBs em um EPUB, na ordem da lista. O PDF ganha um marcador por arquivo (com os marcadores originais dentro); o EPUB ganha um sumário com um item por livro. Dá para escolher arquivos de pastas diferentes em várias vezes.' },
  };
  const ordered = m => m === 'merge' || m === 'i2p';   // listas em que a ordem importa
  let mode = location.hash === '#pdf-epub' ? 'p2e' : location.hash === '#juntar' ? 'merge' : location.hash === '#imagens-pdf' ? 'i2p' : location.hash === '#pdf-imagens' ? 'p2i' : 'e2p';

  let cancelled = false;
  const say = (msg, err) => { statusEl.textContent = msg; statusEl.className = err ? 'err' : ''; };
  const tick = () => new Promise(r => setTimeout(r, 0)).then(() => { if (cancelled) throw new Error('Conversão cancelada.'); });
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function renderList() {
    thumbs.forEach(u => URL.revokeObjectURL(u)); thumbs = [];
    listEl.innerHTML = files.map((f, i) => {
      if (mode === 'i2p') thumbs.push(URL.createObjectURL(f));
      return `<li>${mode === 'i2p' ? `<img class="th" src="${thumbs[i]}" alt="" loading="lazy" decoding="async">` : ''}<span class="n">${esc(f.name)}</span><span class="s">${ordered(mode) ? `${i + 1}º · ${(f.size / 1048576).toFixed(1)} MB` : 'Na fila'}</span>` +
      (ordered(mode) ? `<div class="mv"><button type="button" data-mv="${i}" data-d="-1"${i ? '' : ' disabled'}>↑</button><button type="button" data-mv="${i}" data-d="1"${i < files.length - 1 ? '' : ' disabled'}>↓</button><button type="button" data-mv="${i}" data-d="0">Remover</button></div>` : '') + '</li>';
    }).join('');
    items = [...listEl.children];
  }
  const setItem = (i, text, cls, dl) => {
    const s = items[i].querySelector('.s');
    s.textContent = text; s.className = 's ' + (cls || '');
    if (dl) {
      items[i].querySelector('.n').textContent = dl.name;
      const a = document.createElement('a'); a.href = dl.url; a.download = dl.name; a.textContent = 'Baixar';
      s.appendChild(a);
    }
  };

  const showFiles = () => {
    $('fname').textContent = files.length ? (files.length === 1 ? files[0].name : files.length + ' arquivos selecionados') : MODES[mode].pick;
    $('fmeta').textContent = files.length ? (files.reduce((s, f) => s + f.size, 0) / 1048576).toFixed(1) + ' MB no total' : '';
    go.disabled = mode === 'merge' ? files.length < 2 : !files.length;
    outBtns.style.display = 'none';
    renderList(); say('');
  };
  const pickFiles = list => {
    files = [...list].sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
    showFiles();
  };
  fileEl.addEventListener('change', () => {
    if (!ordered(mode)) return pickFiles(fileEl.files);
    files = files.concat([...fileEl.files].sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true })));   // juntar acumula as escolhas
    fileEl.value = ''; showFiles();
  });
  listEl.addEventListener('click', e => {
    const b = e.target.closest('button[data-mv]');
    if (!b || busy || !ordered(mode)) return;
    const i = +b.dataset.mv, d = +b.dataset.d;
    if (!d) files.splice(i, 1);
    else if (files[i + d]) [files[i], files[i + d]] = [files[i + d], files[i]];
    showFiles();
  });

  const setMode = m => {
    mode = m;
    document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
    $('optE2P').hidden = m !== 'e2p'; $('optP2E').hidden = m !== 'p2e'; $('optMerge').hidden = m !== 'merge'; $('optI2P').hidden = m !== 'i2p'; $('optP2I').hidden = m !== 'p2i';
    go.textContent = m === 'merge' ? 'Juntar' : m === 'i2p' ? 'Criar PDF' : 'Converter';
    fileEl.accept = MODES[m].accept; fileEl.value = '';
    $('note').textContent = MODES[m].note;
    files = []; showFiles();
  };
  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
    if (busy || b.dataset.mode === mode) return;
    history.replaceState(null, '', { p2e: '#pdf-epub', merge: '#juntar', i2p: '#imagens-pdf', p2i: '#pdf-imagens' }[b.dataset.mode] || location.pathname + location.search);
    setMode(b.dataset.mode);
  }));
  setMode(mode);

  // ---------- nome do arquivo: Title Case - Subtítulo (Autor) ----------
  const STOP = new Set(('a o as os um uns uma umas de do da dos das em no na nos nas num numa por pelo pela pelos pelas ' +
    'para pra com sem sob sobre ao aos à às e ou nem até entre perante após ante desde contra ' +
    'the an of and in on at to for but or nor by with from').split(' '));
  const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
  function titleCase(str) {
    const mixed = /\p{Ll}/u.test(str) && /\p{Lu}/u.test(str);
    const words = str.trim().split(/\s+/);
    return words.map((w, i) => w.split('-').map((part, j, arr) => {
      const core = part.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, '');
      if (!core) return part;
      const low = core.toLowerCase(), hasLower = /\p{Ll}/u.test(core), hasUpper = /\p{Lu}/u.test(core);
      let out;
      if (!(i === 0 && j === 0) && i < words.length - 1 && arr.length === 1 && STOP.has(low)) out = low;
      else if (!hasLower && hasUpper && mixed && core.length > 1 && core.length <= 5) out = core;   // sigla/romano já em maiúsculas
      else {
        const base = (!hasLower && hasUpper) ? low : core;
        const m = base.match(/^([dl]['’])(.+)$/i);                                 // d'Água
        out = m && !(i === 0 && j === 0) ? m[1].toLowerCase() + cap(m[2]) : cap(base);
      }
      return part.replace(core, out);
    }).join('-')).join(' ');
  }
  function cleanAuthors(raw) {   // um campo pode trazer vários autores; devolve lista de nomes
    const out = [];
    for (const piece of raw.replace(/\s+/g, ' ').trim().split(/\s*[;&/|+]\s*|\s+(?:and|e)\s+(?=\p{Lu})/u)) {
      if (!piece) continue;
      const parts = piece.split(/\s*,\s*/).filter(Boolean);
      const jr = p => /^(jr|sr|filho|neto|júnior|junior)\.?$/i.test(p);
      if (parts.length === 2 && parts[0].split(' ').length === 1 && !jr(parts[1])) out.push(parts[1] + ' ' + parts[0]);   // "Sobrenome, Nome"
      else if (parts.length > 1 && !parts.slice(1).some(jr)) out.push(...parts);                                         // lista separada por vírgula
      else out.push(piece);
    }
    return out.map(titleCase);
  }
  const bad = /[\\/:*?"<>|\u0000-\u001f]+/g;
  function makeName(title, authors) {
    const parts = title.split(/\s*:\s+|\s+[-–—]\s+|\s*[–—]\s*/).map(s => s.replace(bad, ' ').replace(/\s+/g, ' ').trim()).filter(Boolean);
    let name = (parts.length ? parts : ['Livro']).map(titleCase).join(' - ');
    let au = authors.flatMap(cleanAuthors).filter(Boolean);
    if (au.length > 3) au = [au[0] + ' et al.'];
    const suffix = au.length ? ` (${au.join(', ').replace(bad, ' ')})` : '';
    if (name.length + suffix.length > 190) name = name.slice(0, 190 - suffix.length).trim();
    return name + suffix;
  }

  // ---------- caminhos dentro do zip ----------
  const dirname = p => p.includes('/') ? p.slice(0, p.lastIndexOf('/') + 1) : '';
  function resolve(base, rel) {
    rel = rel.split('#')[0].split('?')[0];
    try { rel = decodeURIComponent(rel); } catch (e) {}
    const parts = (rel.startsWith('/') ? rel.slice(1) : dirname(base) + rel).split('/');
    const out = [];
    for (const p of parts) { if (p === '..') out.pop(); else if (p && p !== '.') out.push(p); }
    return out.join('/');
  }

  // ---------- constantes de página ----------
  const MM = 72 / 25.4;
  const PAGES = { letter: [612, 792], A4: [595.276, 841.89], A5: [419.528, 595.276] };
  const BLOCK = new Set(['p','div','h1','h2','h3','h4','h5','h6','li','blockquote','pre','section','article','aside',
    'header','footer','figure','figcaption','ul','ol','table','tr','dd','dt','dl','hr','body','nav','main','caption']);
  const SKIP = new Set(['head','script','style','title','meta','link','audio','video','iframe','object','embed','canvas','map']);

  // ---------- EPUB -> blocos ----------
  function buildBlocks(root, itemHref, blocks) {
    let cur = null;
    const trim = p => {
      const t = p.toks;
      while (t.length && t[0].sp) t.shift();
      while (t.length && t[t.length - 1].sp) t.pop();
    };
    const flush = () => { if (cur) { trim(cur); if (cur.toks.length) blocks.push(cur); cur = null; } };
    const ensure = ctx => {
      if (!cur) {
        let label = null;
        if (ctx.lab && !ctx.lab.used) { ctx.lab.used = true; label = ctx.lab.text; }
        cur = { t: 'p', kind: ctx.kind, align: ctx.align, quote: ctx.quote, label, pre: ctx.pre, toks: [] };
      }
      return cur;
    };
    const addSp = () => {
      if (!cur) return;
      const l = cur.toks[cur.toks.length - 1];
      if (l && !l.sp && !l.br) cur.toks.push({ sp: true });
    };
    const addWord = (w, ctx) => {
      const p = ensure(ctx);
      const l = p.toks[p.toks.length - 1];
      const part = { w, f: ctx.f, sup: ctx.sup };
      if (l && !l.sp && !l.br) l.parts.push(part); else p.toks.push({ parts: [part] });
    };
    const addText = (txt, ctx) => {
      txt = txt.replace(/[­​‌‍﻿]/g, '').replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, '');
      if (ctx.pre) {
        txt.split('\n').forEach((line, i) => {
          if (i) ensure(ctx).toks.push({ br: true });
          line.replace(/\s+/g, ' ').trim().split(' ').filter(Boolean).forEach((w, k) => { if (k) addSp(); addWord(w, ctx); });
        });
        return;
      }
      const s = txt.replace(/\s+/g, ' ');
      if (!s.trim()) { if (s && cur) addSp(); return; }
      if (s[0] === ' ') addSp();
      s.trim().split(' ').forEach((w, i) => { if (i) addSp(); addWord(w, ctx); });
      if (s.endsWith(' ')) addSp();
    };

    const walk = (node, ctx) => {
      if (node.nodeType === 3) { addText(node.nodeValue, ctx); return; }
      if (node.nodeType !== 1) return;
      const tag = (node.localName || node.nodeName).toLowerCase();
      if (SKIP.has(tag) || node.hasAttribute('hidden')) return;

      if (tag === 'img' || tag === 'image') {
        const v = node.getAttribute('src') || node.getAttribute('href') || node.getAttribute('xlink:href');
        if (v && !/^data:/i.test(v)) { flush(); blocks.push({ t: 'img', path: resolve(itemHref, v) }); }
        return;
      }
      if (tag === 'br') { if (cur) cur.toks.push({ br: true }); return; }
      if (tag === 'hr') { flush(); blocks.push({ t: 'hr' }); return; }

      let c = ctx;
      const style = node.getAttribute('style') || '', cls = node.getAttribute('class') || '';
      if (/text-align\s*:\s*center/i.test(style) || /center/i.test(cls) || node.getAttribute('align') === 'center') c = { ...c, align: 'center' };
      else if (/text-align\s*:\s*right/i.test(style) || /\bright\b/i.test(cls)) c = { ...c, align: 'right' };

      if (/^h[1-6]$/.test(tag)) {
        flush();

  function jpegInfo(b) {   // componentes de cor e orientação EXIF de um JPEG
    let comps = 3, orient = 1;
    for (let i = 2; i + 4 < b.length;) {
      if (b[i] !== 0xFF) { i++; continue; }
      const m = b[i + 1];
      if (m === 0xFF) { i++; continue; }
      if (m === 0xD8 || (m >= 0xD0 && m <= 0xD7) || m === 0x01) { i += 2; continue; }
      const len = (b[i + 2] << 8) | b[i + 3];
      if (m >= 0xC0 && m <= 0xCF && m !== 0xC4 && m !== 0xC8 && m !== 0xCC) { comps = b[i + 9]; break; }
      if (m === 0xDA) break;
      if (m === 0xE1 && b[i + 4] === 0x45 && b[i + 5] === 0x78 && b[i + 6] === 0x69 && b[i + 7] === 0x66) {   // "Exif"
        const t = i + 10, le = b[t] === 0x49, u16 = o => le ? b[o] | (b[o + 1] << 8) : (b[o] << 8) | b[o + 1];
        const u32 = o => le ? (b[o] | (b[o + 1] << 8) | (b[o + 2] << 16) | (b[o + 3] << 24)) >>> 0 : ((b[o] << 24) | (b[o + 1] << 16) | (b[o + 2] << 8) | b[o + 3]) >>> 0;
        const ifd = t + u32(t + 4), n = u16(ifd);
        for (let k = 0; k < n && ifd + 14 + k * 12 < b.length; k++) if (u16(ifd + 2 + k * 12) === 0x0112) orient = u16(ifd + 10 + k * 12);
      }
      i += 2 + len;
    }
    return { comps, orient };
  }

  async function imageForPdf(pdf, file) {   // devolve a imagem já embutida no PDF
    const bytes = new Uint8Array(await file.arrayBuffer());
    const jpg = bytes[0] === 0xFF && bytes[1] === 0xD8, png = bytes[0] === 0x89 && bytes[1] === 0x50 && bytes[2] === 0x4E && bytes[3] === 0x47;
    if (jpg) { const { comps, orient } = jpegInfo(bytes); if (comps !== 4 && orient <= 1) return pdf.embedJpg(bytes); }
    else if (png) { try { return await pdf.embedPng(bytes); } catch (e) { /* PNG fora do comum: passa pelo canvas */ } }
    let bmp;
    try { bmp = await createImageBitmap(new Blob([bytes]), { imageOrientation: 'from-image' }); }
    catch (e) { throw new Error(`${file.name}: formato de imagem que o navegador não abre.`); }
    const cv = document.createElement('canvas'); cv.width = bmp.width; cv.height = bmp.height;
    const cx = cv.getContext('2d'); cx.drawImage(bmp, 0, 0); bmp.close();
    let alpha = false;
    if (!jpg) {
      const d = cx.getImageData(0, 0, cv.width, cv.height).data;
      for (let k = 3; k < d.length; k += 4) if (d[k] < 255) { alpha = true; break; }
    }
    if (alpha) return pdf.embedPng(new Uint8Array(await (await toBlob(cv, 'image/png')).arrayBuffer()));
    const flat = document.createElement('canvas'); flat.width = cv.width; flat.height = cv.height;
    const fx = flat.getContext('2d'); fx.fillStyle = '#fff'; fx.fillRect(0, 0, flat.width, flat.height); fx.drawImage(cv, 0, 0);

  async function imagesToPdf(list, title, say) {

      if (size !== 'fit' && (img.width > img.height) !== (pw > ph)) [pw, ph] = [ph, pw];   // a página acompanha a orientação da imagem
      const k = Math.min((pw - 2 * mar) / img.width, (ph - 2 * mar) / img.height), w = img.width * k, h = img.height * k;
      out.addPage([pw, ph]).drawImage(img, { x: (pw - w) / 2, y: (ph - h) / 2, width: w, height: h });

  function pageRange(text, n) {   // "1-3, 7, 10-" -> [0, 1, 2, 6, 9, ...]
    text = text.trim();
    if (!text) return Array.from({ length: n }, (_, i) => i);
    const set = new Set();
    for (const part of text.split(/[,;\s]+/).filter(Boolean)) {
      const m = part.match(/^(\d*)(?:-(\d*))?$/);
      if (!m || (!m[1] && !m[2])) throw new Error(`Páginas inválidas: "${part}". Use algo como 1-5, 8, 10-12.`);
      const a = m[1] ? +m[1] : 1, b = m[2] === undefined ? a : m[2] ? +m[2] : n;
      for (let p = Math.max(1, Math.min(a, b)); p <= Math.min(n, Math.max(a, b)); p++) set.add(p - 1);
    }
    if (!set.size) throw new Error(`Esse PDF tem ${n} página(s); nenhuma cai em "${text}".`);
    return [...set].sort((a, b) => a - b);
  }

  async function runPdfToImages() {

    try {
      initPdfjs();
      const used = new Set();
      for (let i = 0; i < files.length; i++) {
        setItem(i, 'Lendo…'); await tick();

            const page = await doc.getPage(idx[k] + 1);

      }
      await showOut({ ext, mime, many: png ? 'PNGs' : 'JPEGs' });
      say(`Pronto: ${results.length} ${results.length > 1 ? 'imagens' : 'imagem'}. Toque em baixar.`);
    } catch (e) {
      console.error(e);
      if (results.length) { await showOut({ ext, mime, many: png ? 'PNGs' : 'JPEGs' }); say((cancelled ? 'Cancelado' : 'Erro: ' + (e.message || e)) + `. ${results.length} imagem(ns) já pronta(s): toque em baixar.`, true); }
      else say(cancelled ? 'Cancelado.' : 'Erro: ' + (e.message || e), true);
    }
    busy = false; go.disabled = !files.length; fileEl.disabled = false; $('cancel').style.display = 'none';
  }

  async function runImagesToPdf() {
    busy = true; cancelled = false; go.disabled = true; fileEl.disabled = true; outBtns.style.display = 'none'; $('cancel').style.display = '';
    results.forEach(r => URL.revokeObjectURL(r.url)); if (zipUrl) URL.revokeObjectURL(zipUrl);
    results = []; zipUrl = null; renderList();
    listEl.querySelectorAll('.mv').forEach(d => d.remove());
    try {
      const title = $('iTitle').value.trim() || (files.length === 1 ? stem(files[0]) : guessTitle(files));
      const r = await imagesToPdf(files, title, say);
      const name = makeName(r.title, []) + '.pdf';
      const url = URL.createObjectURL(new Blob([r.bytes], { type: 'application/pdf' }));
      results.push({ name, url, bytes: r.bytes, mime: 'application/pdf' });
      await showOut({ ext: 'pdf', mime: 'application/pdf', many: 'PDFs' });
      say(`Pronto: ${r.pages} ${r.pages > 1 ? 'imagens' : 'imagem'} em um PDF (${(r.bytes.length / 1048576).toFixed(1)} MB). Toque em baixar.`);
    } catch (e) {
      console.error(e);
      say(cancelled ? 'Cancelado.' : 'Erro: ' + (e.message || e), true);
    }
    busy = false; go.disabled = !files.length; fileEl.disabled = false; $('cancel').style.display = 'none';
  }

  // ---------- lote ----------
  const save = (url, name) => { const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); };

  async function showOut(M) {
    if (!results.length) return;
    if (results.length > 1) {
      say('Montando o ZIP…'); await tick();
      const z = new JSZip();
      results.forEach(r => z.file(r.name, r.bytes, { compression: 'STORE' }));
      zipUrl = URL.createObjectURL(await z.generateAsync({ type: 'blob', compression: 'STORE' }));
    }
    zipBtn.style.display = results.length > 1 ? '' : 'none';
    sepBtn.textContent = sepBtn.dataset.label = results.length > 1 ? `Baixar todos os ${M.many} (sem ZIP)` : `Baixar o ${M.ext.toUpperCase()}`;
    sepBtn.className = results.length > 1 ? 'alt' : '';
    outBtns.style.display = 'block';
    shareBtn.textContent = `Compartilhar ${M.many}…`;
    shareBtn.style.display = canShare(results.map(r => new File([new Uint8Array(1)], r.name, { type: r.mime }))) ? '' : 'none';
  }

  async function runBatch() {
    busy = true; cancelled = false; go.disabled = true; fileEl.disabled = true; outBtns.style.display = 'none'; $('cancel').style.display = '';
    const M = MODES[mode], convert = mode === 'p2e' ? pdfToEpub : epubToPdf;
    results.forEach(r => URL.revokeObjectURL(r.url)); if (zipUrl) URL.revokeObjectURL(zipUrl);
    results = []; zipUrl = null; renderList();
    const used = new Map();
    for (let i = 0; i < files.length; i++) {
      say(`Convertendo ${i + 1} de ${files.length}…`);
      try {
        const r = await convert(files[i], m => setItem(i, m));
        let base = makeName(r.title, r.authors), name = base, n = 1;
        while (used.has(name.toLowerCase())) name = `${base} (${++n})`;
        used.set(name.toLowerCase(), 1);
        name += '.' + M.ext;
        const url = URL.createObjectURL(new Blob([r.bytes], { type: M.mime }));
        results.push({ name, url, bytes: r.bytes, mime: M.mime });
        const info = r.chapters ? `${r.chapters} ${r.chapters > 1 ? 'capítulos' : 'capítulo'}` : `${r.pages} páginas`;
        setItem(i, `✓ ${info} · ${(r.bytes.length / 1048576).toFixed(1)} MB${r.garbledPages ? ` · ${r.garbledPages} página(s) com texto ilegível no PDF entraram como imagem` : ''}`, 'ok', { name, url });
      } catch (e) {
        console.error(e);
        setItem(i, cancelled ? 'Cancelado' : 'Erro: ' + (e.message || e), 'err');
        if (cancelled) { for (let k = i + 1; k < files.length; k++) setItem(k, 'Cancelado', 'err'); break; }
      }
      if (cancelled) break;
      await tick();
    }
    await showOut(M);
    const fail = files.length - results.length;
    if (cancelled) say(results.length ? `Cancelado. ${results.length} já convertido(s): toque em baixar.` : 'Conversão cancelada.');
    else say(`Pronto: ${results.length} convertido(s)${fail ? `, ${fail} com erro` : ''}. Toque em baixar.`, !results.length);
    busy = false; go.disabled = false; fileEl.disabled = false; $('cancel').style.display = 'none';
  }
  async function runMerge() {
    busy = true; cancelled = false; go.disabled = true; fileEl.disabled = true; outBtns.style.display = 'none'; $('cancel').style.display = '';
    results.forEach(r => URL.revokeObjectURL(r.url)); if (zipUrl) URL.revokeObjectURL(zipUrl);
    results = []; zipUrl = null; renderList();
    listEl.querySelectorAll('.mv').forEach(d => d.remove());
    try {
      const kinds = await Promise.all(files.map(kindOf));
      const kind = kinds[0];
      const bad = files.find((f, i) => kinds[i] !== kind);
      if (!kind) throw new Error(`${files[0].name}: não é PDF nem EPUB.`);
      if (bad) throw new Error(`${bad.name}: misturar PDF e EPUB não dá. Escolha só ${kind === 'pdf' ? 'PDFs' : 'EPUBs'}.`);
      const title = $('mTitle').value.trim() || guessTitle(files);
      const r = await (kind === 'pdf' ? mergePdfs : mergeEpubs)(files, title, say);
      const M = kind === 'pdf' ? { ext: 'pdf', mime: 'application/pdf', many: 'PDFs' } : { ext: 'epub', mime: 'application/epub+zip', many: 'EPUBs' };
      const name = makeName(r.title, r.authors) + '.' + M.ext;
      const url = URL.createObjectURL(new Blob([r.bytes], { type: M.mime }));
      results.push({ name, url, bytes: r.bytes, mime: M.mime });
      await showOut(M);
      say(`Pronto: ${files.length} ${M.many} juntados em um só (${(r.bytes.length / 1048576).toFixed(1)} MB${r.pages ? `, ${r.pages} páginas` : ''}). Toque em baixar.`);
    } catch (e) {
      console.error(e);
      say(cancelled ? 'Cancelado.' : 'Erro: ' + (e.message || e), true);
    }
    busy = false; go.disabled = files.length < 2; fileEl.disabled = false; $('cancel').style.display = 'none';
  }
  $('cancel').addEventListener('click', () => { cancelled = true; say('Cancelando…'); });

  const canShare = fl => { try { return !!(navigator.canShare && navigator.canShare({ files: fl })); } catch (e) { return false; } };
  shareBtn.addEventListener('click', async () => {
    try { await navigator.share({ files: results.map(r => new File([r.bytes], r.name, { type: r.mime })) }); }
    catch (e) { if (e.name !== 'AbortError') say('Não foi possível compartilhar: ' + (e.message || e), true); }
  });
  zipBtn.addEventListener('click', () => { if (zipUrl) save(zipUrl, { 'application/pdf': `PDFs (${results.length} livros).zip`, 'application/epub+zip': `EPUBs (${results.length} livros).zip` }[results[0].mime] || `Imagens (${results.length}).zip`); });
  sepBtn.addEventListener('click', async () => {
    sepBtn.disabled = true;
    for (let i = 0; i < results.length; i++) {
      sepBtn.textContent = `Baixando ${i + 1} de ${results.length}…`;
      save(results[i].url, results[i].name);
      await new Promise(res => setTimeout(res, 900));
    }
    sepBtn.disabled = false; sepBtn.textContent = sepBtn.dataset.label;
  });
  go.addEventListener('click', () => ({ merge: runMerge, i2p: runImagesToPdf, p2i: runPdfToImages }[mode] || runBatch)());
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
